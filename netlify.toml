[build]
  base = "ipmetabackend"
  publish = "public"
  functions = "netlify/functions"
  command = "npm install && npm run build"

# The Nest app itself (see netlify/functions/api.ts) is not prefixed with
# "api" — this redirect owns that prefix so the deployed URL matches the
# same /api/* shape the Render/traditional-server deployment uses.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# NestJS's core has optional, feature-gated require() calls for peer
# packages this app never installs (microservices/websockets support,
# class-validator/class-transformer for decorator-based validation). Esbuild
# resolves every require() it finds statically, so bundling fails on these
# even though the code paths never run. Marking them external skips
# resolving them at bundle time; Node just never reaches those lines.
[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "@nestjs/microservices",
    "@nestjs/microservices/microservices-module",
    "@nestjs/websockets/socket-module",
    "class-validator",
    "class-transformer",
  ]
